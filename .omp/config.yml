# Project scope only. The host guard in ~/.omp/agent/config.yml and the
# secret-guard hook (hooks/pre/secret-guard.ts) stay in force: the hook stops
# bash/eval calls that touch secret material, and tools.restrictedFolders is
# host-only by design. Evals themselves are not prompted.
tools:
  approval:
    web_search: allow
bash:
  # Ordered, first match wins; project rules are evaluated before the host rules.
  patterns:
    - match: "git push --force*"
      approval: prompt
    - match: "git push -f*"
      approval: prompt
    - match: "git add*"
      approval: allow
    - match: "git commit*"
      approval: allow
    - match: "git push*"
      approval: allow
    - match: "git switch -c*"
      approval: allow
    - match: "git checkout -b*"
      approval: allow
    - match: "gh pr create*"
      approval: allow
